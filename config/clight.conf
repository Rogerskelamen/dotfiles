##
## User overrides for Dell XPS 13 DX13260
## Ambient Light Sensor: Dell ISH / TCS3530
##

##
## Ambient-light → screen-backlight curve.
##
## Clight normalizes the sensor input to [0.0, 1.0].
## These are the default points for now; tune them after
## observing the actual behavior on this machine.
##
sensor:
{
  ac_regression_points = [
    0.080,
    0.084,
    0.156,
    0.234,
    0.317,
    0.408,
    0.510,
    0.616,
    0.729,
    0.841,
    0.950
  ];

  batt_regression_points = [
    0.080,
    0.090,
    0.120,
    0.160,
    0.210,
    0.280,
    0.380,
    0.490,
    0.610,
    0.720,
    0.800
  ];
};

##
## Dimmer
## Disabled for now.
## The default AC/BATT timeouts are 45s / 20s. */
##
dimmer:
{
  disabled = true
}


##
## Disable screen-content brightness compensation.
##
## This makes backlight depend on ambient light only,
## rather than additionally compensating for white/dark
## screen contents.
##
screen:
{
  disabled = true;
};

##
## Disable DPMS.
##
## Do not automatically turn the display off after idle timeout.
##
dpms:
{
  disabled = true;
};

##
## Smooth automatic backlight transitions.
##
## Keep these enabled and use a fixed ~1 second transition
## to make brightness changes feel closer to macOS.
##
backlight:
{
  #
  # Capture intervals, in seconds:
  # [ daytime, nighttime, sunrise/sunset event ]
  #
  ac_timeouts = [ 60, 120, 60 ];
  batt_timeouts = [ 120, 180, 120 ];

  # Smoothly transfer to other light level, in milliseconds
  no_smooth_transition = false;
  trans_fixed = 2500;
};

gamma:
{
  # Restore the original display temperature when Clight exits.
  restore_on_exit = true;

  # Temperature range
  temp = [ 6500, 5500 ];

  # Let gamma follow the effective screen brightness.
  #
  # Since screen brightness is already driven by the TCS3530
  # ambient-light sensor, this gives us an ambient-light-driven
  # color-temperature effect.
  ambient_gamma = true;

  # Smooth transition.
  no_smooth_transition = false;
  trans_step = 50;
  trans_timeout = 300;
};


